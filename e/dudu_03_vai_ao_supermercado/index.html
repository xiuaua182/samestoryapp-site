<head>

<meta name="description" content="Perdido num supermercado lotado, Dudu mantém a calma e mostra que sabe exatamente o que fazer.">

<!-- Estas 4 linhas "og:" controlam a PRÉVIA que aparece quando alguém
     compartilha este link no WhatsApp: título, texto e a imagem da capa. -->
<meta property="og:title" content="Dudu vai ao supermercado · Na Mesma Estória">
<meta property="og:description" content="Perdido num supermercado lotado, Dudu mantém a calma e mostra que sabe exatamente o que fazer.">

<!-- Carrega a fonte Nunito (a mesma do app) direto do Google. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

<style>
/* ===== Aparência da página (cores da marca) ===== */
:root{
  --bege:#FAF4EE;        /* fundo claro do app */
  --azul-noite:#1B2D4F;  /* azul das telas do filho */
  --verde-pai:#1A7A5E;   /* verde dos botões do Reader */
  --dourado:#D4A340;     /* selo premium */
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Nunito',sans-serif;
  background:var(--bege);
  color:var(--azul-noite);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
}

/* Faixa azul-noite no topo, com estrelinhas — eco da Tela de Boa Noite */
.ceu{
  width:100%;
  background:
    radial-gradient(1.5px 1.5px at 20% 35%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 65% 20%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 85% 60%, #ffffffAA 50%, transparent 51%),
    radial-gradient(1px 1px at 40% 70%, #ffffffAA 50%, transparent 51%),
    linear-gradient(180deg, #12203C 0%, var(--azul-noite) 100%);
  color:#fff;
  text-align:center;
  padding:26px 16px 60px;
}
.ceu .app{font-weight:800;font-size:1.15rem;letter-spacing:.02em}
.ceu .tagline{opacity:.85;font-size:.9rem;margin-top:4px}

/* Barra de bandeiras para trocar de idioma */
.bandeiras{margin-top:14px}
.bandeiras button{
  background:none;border:none;font-size:1.35rem;cursor:pointer;
  padding:4px 5px;border-radius:8px;line-height:1;
  filter:grayscale(.55) opacity(.7);          /* apagadinha quando não escolhida */
  transition:filter .15s, transform .15s;
}
.bandeiras button.ativa{filter:none;transform:scale(1.18)}  /* acesa quando ativa */

/* Cartão principal, "flutuando" sobre a faixa azul */
.cartao{
  width:min(92%,430px);
  background:#fff;
  border-radius:22px;
  box-shadow:0 8px 30px rgba(27,45,79,.14);
  margin:-40px auto 32px;   /* margem negativa = sobe e invade a faixa azul */
  overflow:hidden;
}
.cartao img.capa{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
.conteudo{padding:22px 24px 26px}
h1{font-size:1.45rem;font-weight:800;line-height:1.25}
.selo-premium{
  display:none;   /* "inline-block" se premium, "none" se free */
  background:var(--dourado);color:#fff;font-size:.72rem;font-weight:800;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;letter-spacing:.03em;
}
.descricao{margin-top:12px;font-size:.98rem;line-height:1.55;white-space:pre-line}
.como{margin-top:16px;font-size:.86rem;line-height:1.5;opacity:.75}

/* Botão verde da Play Store */
.botao-play{
  display:block;text-align:center;text-decoration:none;
  background:var(--verde-pai);color:#fff;font-weight:800;font-size:1.02rem;
  padding:15px 18px;border-radius:999px;margin-top:20px;
  box-shadow:0 4px 14px rgba(26,122,94,.35);
}
.botao-play:active{transform:scale(.98)}

footer{padding:0 16px 28px;font-size:.8rem;opacity:.65}
footer a{color:var(--azul-noite)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<!-- Faixa azul do topo: nome do app + frase + bandeiras -->
<div class="ceu">
  <div class="app" id="ui-app">Na Mesma Estória</div>
  <div class="tagline" id="ui-tagline">Ler juntos, mesmo distantes.</div>
  <div class="bandeiras" id="bandeiras"></div>
</div>

<!-- Cartão com capa, título, descrição e botão -->
<div class="cartao">
  <img class="capa" src="cover.webp" alt="" id="capa">
  <div class="conteudo">
    <span class="selo-premium">PREMIUM</span>
    <h1 id="titulo"></h1>
    <p class="descricao" id="descricao"></p>
    <p class="como" id="ui-como"></p>
    <a class="botao-play" id="ui-botao" href="https://play.google.com/store/apps/details?id=com.samestoryapp.app&referrer=utm_source%3Dsamestoryapp%26utm_medium%3Dstory_page%26utm_content%3Ddudu_03_vai_ao_supermercado"></a>
  </div>
</div>

<footer><a id="ui-politica" href=""></a></footer>

<script>
/* ============================================================
   Parte "viva" da página (JavaScript):
   1) guarda os textos da estória nos 7 idiomas;
   2) descobre o idioma do navegador da pessoa;
   3) preenche a página nesse idioma;
   4) troca tudo na hora quando uma bandeira é tocada.
   ============================================================ */

// Todos os textos, já embutidos na página pelo script Python:
const DADOS = {"pt": {"titulo": "Dudu vai ao supermercado", "descricao": "A TV velha da família finalmente parou de funcionar, e lá foram todos ao supermercado mais movimentado da cidade.\nEntre promoções e multidões, Dudu se distrai com um simulador de videogame e acaba se perdendo do pai.\nUma história divertida sobre manter a calma, procurar alguém seguro e pedir ajuda.", "app": "Na Mesma Estória", "tagline": "Ler juntos, mesmo distantes.", "como": "Você lê em voz alta no seu aparelho e seu filho acompanha as imagens no dele — mesmo à distância.", "botao": "Baixar no Google Play", "politica": "Política de privacidade", "arquivoPolitica": "privacidade.html"}, "en": {"titulo": "Dudu Goes to the Supermarket", "descricao": "The family's old TV finally gave out, so off they went to the busiest supermarket in town.\nAmid the deals and the crowds, Dudu gets distracted by a video game simulator and ends up losing his dad.\nA fun story about staying calm, finding someone safe, and asking for help.", "app": "SameSTORY", "tagline": "Reading together, even apart.", "como": "You read aloud on your device while your child follows the pictures on theirs — even from far away.", "botao": "Get it on Google Play", "politica": "Privacy policy", "arquivoPolitica": "privacy.html"}, "es": {"titulo": "Dudu va al supermercado", "descricao": "La vieja tele de la familia por fin dejó de funcionar, así que todos fueron al supermercado más concurrido de la ciudad.\nEntre las ofertas y la multitud, Dudu se distrae con un simulador de videojuegos y termina perdiéndose de su papá.\nUna historia divertida sobre mantener la calma, buscar a alguien seguro y pedir ayuda.", "app": "En la Misma Historia", "tagline": "Leer juntos, aunque estén lejos.", "como": "Tú lees en voz alta en tu dispositivo y tu hijo sigue las imágenes en el suyo, incluso a distancia.", "botao": "Descargar en Google Play", "politica": "Política de privacidad", "arquivoPolitica": "privacidad.html"}, "it": {"titulo": "Dudu va al supermercato", "descricao": "La vecchia TV della famiglia ha finalmente smesso di funzionare, e così sono andati tutti al supermercato più affollato della città.\nTra offerte e folla, Dudu si distrae con un simulatore di videogiochi e finisce per perdersi dal suo papà.\nUna storia divertente su come restare calmi, cercare qualcuno di fidato e chiedere aiuto.", "app": "SameSTORY", "tagline": "Leggere insieme, anche lontani.", "como": "Tu leggi ad alta voce sul tuo dispositivo e tuo figlio segue le immagini sul suo, anche a distanza.", "botao": "Scarica su Google Play", "politica": "Informativa sulla privacy", "arquivoPolitica": "informativa-privacy.html"}, "de": {"titulo": "Dudu geht in den Supermarkt", "descricao": "Der alte Fernseher der Familie gab endgültig den Geist auf, also ging es ab in den belebtesten Supermarkt der Stadt.\nZwischen Angeboten und Menschenmassen lässt sich Dudu von einem Videospielsimulator ablenken und verliert dabei seinen Papa aus den Augen.\nEine lustige Geschichte übers Ruhigbleiben, Suchen nach jemandem Vertrauenswürdigem und Um-Hilfe-Bitten.", "app": "SameSTORY", "tagline": "Gemeinsam lesen, auch aus der Ferne.", "como": "Du liest auf deinem Gerät laut vor und dein Kind folgt den Bildern auf seinem — auch aus der Ferne.", "botao": "Bei Google Play laden", "politica": "Datenschutzerklärung", "arquivoPolitica": "datenschutz.html"}, "fr": {"titulo": "Dudu va au supermarché", "descricao": "La vieille télé de la famille a fini par rendre l'âme, alors les voilà partis au supermarché le plus fréquenté de la ville.\nEntre les promotions et la foule, Dudu se laisse distraire par un simulateur de jeux vidéo et finit par perdre son papa.\nUne histoire amusante sur l'art de rester calme, de trouver quelqu'un de confiance et de demander de l'aide.", "app": "SameSTORY", "tagline": "Lire ensemble, même à distance.", "como": "Vous lisez à voix haute sur votre appareil et votre enfant suit les images sur le sien — même à distance.", "botao": "Télécharger sur Google Play", "politica": "Politique de confidentialité", "arquivoPolitica": "confidentialite.html"}, "nl": {"titulo": "Dudu gaat naar de supermarkt", "descricao": "De oude tv van het gezin gaf het eindelijk op, dus gingen ze allemaal naar de drukste supermarkt van de stad.\nTussen de aanbiedingen en de drukte raakt Dudu afgeleid door een gamesimulator en raakt hij zijn papa kwijt.\nEen leuk verhaal over rustig blijven, iemand veiligs opzoeken en om hulp vragen.", "app": "SameSTORY", "tagline": "Samen lezen, ook op afstand.", "como": "Jij leest hardop voor op jouw apparaat en je kind volgt de plaatjes op het zijne — ook op afstand.", "botao": "Downloaden in Google Play", "politica": "Privacybeleid", "arquivoPolitica": "privacybeleid.html"}};

// Lista de idiomas na ordem das bandeiras:
const IDIOMAS = [{"cod": "pt", "bandeira": "🇧🇷"}, {"cod": "en", "bandeira": "🇺🇸"}, {"cod": "es", "bandeira": "🇪🇸"}, {"cod": "it", "bandeira": "🇮🇹"}, {"cod": "de", "bandeira": "🇩🇪"}, {"cod": "fr", "bandeira": "🇫🇷"}, {"cod": "nl", "bandeira": "🇳🇱"}];

// Descobre o idioma preferido do navegador (ex.: "pt-BR" vira "pt").
// Se não for um dos 7, cai no inglês.
function idiomaDoNavegador(){
  const cod = (navigator.language || "en").slice(0,2).toLowerCase();
  return DADOS[cod] ? cod : "en";
}

// Preenche a página inteira no idioma escolhido:
function aplicarIdioma(cod){
  const d = DADOS[cod];
  document.documentElement.lang = cod;              // avisa o navegador o idioma
  document.getElementById("titulo").textContent = d.titulo;
  document.getElementById("descricao").textContent = d.descricao;
  document.getElementById("capa").alt = d.titulo;   // descrição da imagem (acessibilidade)
  document.getElementById("ui-app").textContent = d.app;
  document.getElementById("ui-tagline").textContent = d.tagline;
  document.getElementById("ui-como").textContent = d.como;
  document.getElementById("ui-botao").textContent = d.botao;
  const pol = document.getElementById("ui-politica");
  pol.textContent = d.politica;
  pol.href = "/" + d.arquivoPolitica;               // política no mesmo idioma
  // Acende a bandeira ativa e apaga as outras:
  document.querySelectorAll(".bandeiras button").forEach(b =>
    b.classList.toggle("ativa", b.dataset.cod === cod));
}

// Cria os botões de bandeira (um por idioma):
const barra = document.getElementById("bandeiras");
IDIOMAS.forEach(function(item){
  const b = document.createElement("button");
  b.textContent = item.bandeira;
  b.dataset.cod = item.cod;
  b.setAttribute("aria-label", item.cod);           // leitor de tela sabe o idioma
  b.onclick = function(){ aplicarIdioma(item.cod); };
  barra.appendChild(b);
});

// Ao abrir a página: aplica o idioma detectado.
aplicarIdioma(idiomaDoNavegador());
</script>
</body>
</html>
