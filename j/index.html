<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Você foi convidado | SameSTORY</title>

  <!-- Preview no WhatsApp / Telegram -->
  <meta property="og:title" content="Você foi convidado para ler junto!">
  <meta property="og:description" content="Pai e filho na mesma história, mesmo distantes.">
  <meta property="og:type" content="website">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FAF4EE;
      color: #1B2D4F;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .emoji { font-size: 64px; margin-bottom: 16px; }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #1B2D4F;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .subtitulo {
      font-size: 15px;
      color: #8D7E6E;
      margin-bottom: 36px;
    }

    .codigo-label {
      font-size: 13px;
      color: #8D7E6E;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .codigo {
      font-size: 56px;
      font-weight: 900;
      color: #1A7A5E;
      letter-spacing: 14px;
      margin-bottom: 36px;
      font-family: 'Courier New', monospace;
    }

    /* ──────────────────────────────────────────────────────────────
       HIERARQUIA DOS BOTÕES — mudou de propósito.

       Quem está vendo esta página é, quase sempre, alguém que NÃO
       tem o app: se tivesse, o Android teria aberto o app direto e
       esta página nem apareceria.

       Por isso o botão principal (verde da marca) passou a ser o de
       INSTALAR. O de "já tenho o app" virou um link discreto.
       Antes era o contrário — o botão mais chamativo era justamente
       o que não funciona neste contexto.
       ────────────────────────────────────────────────────────────── */
    .botao {
      display: block;
      background: #1A7A5E;
      color: white;
      padding: 18px 32px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(26,122,94,0.3);
      transition: transform 0.1s, box-shadow 0.1s;
      margin-bottom: 16px;
    }

    .botao:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(26,122,94,0.3);
    }

    /* Botão secundário: mesma forma, sem peso visual. */
    .botao-secundario {
      display: block;
      background: transparent;
      color: #1A7A5E;
      border: 1.5px solid #D8D2C8;
      padding: 14px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      box-shadow: none;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #C8C4BD;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E5E2DD;
    }

    .info {
      color: #8D7E6E;
      font-size: 14px;
      line-height: 1.6;
    }

    .codigo-manual {
      display: inline-block;
      background: #F0EBE3;
      color: #1A7A5E;
      font-weight: 800;
      font-family: 'Courier New', monospace;
      padding: 4px 12px;
      border-radius: 8px;
      letter-spacing: 4px;
      font-size: 18px;
      margin-top: 8px;
    }

    /* Bloco escondido quando a URL não traz um código válido. */
    .oculto { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📖</div>
    <h1>Você foi convidado para ler junto!</h1>
    <p class="subtitulo">Pai e filho na mesma história, mesmo distantes.</p>

    <!-- Todo o bloco do código some se a URL não trouxer um código
         válido (ex: alguém abriu samestoryapp.com/j/ sem nada depois).
         Antes a página mostrava um travessão "—" sem explicação. -->
    <div id="blocoCodigo">
      <div class="codigo-label">Código da sessão</div>
      <div class="codigo" id="codigo">—</div>
    </div>

    <!-- BOTÃO PRINCIPAL: instalar.
         O href real é montado pelo script lá embaixo, porque ele
         precisa carregar o código da sessão junto. O endereço aqui
         é só o fallback (Play Store sem código) para o caso de o
         JavaScript não rodar. -->
    <a class="botao" id="botaoInstalar"
       href="https://play.google.com/store/apps/details?id=com.samestoryapp.app">
      Instalar SameSTORY
    </a>

    <!-- BOTÃO SECUNDÁRIO: para quem já tem o app instalado mas caiu
         aqui mesmo assim (verificação de App Links falhou, ou o link
         foi aberto de dentro de um app que não respeita App Links). -->
    <a class="botao-secundario" href="#" id="botaoAbrir">Já tenho o app</a>

    <div class="divider">ou</div>

    <p class="info">
      Com o app aberto, digite o código:<br>
      <span class="codigo-manual" id="codigoManual">—</span>
    </p>
  </div>

  <script>
    // =================================================================
    // 1) DE ONDE VEM O CÓDIGO
    //
    // A URL é https://samestoryapp.com/j/8PT7D3 — o código é o último
    // pedaço do caminho. O filter(Boolean) joga fora os pedaços vazios
    // (a barra final, por exemplo).
    // =================================================================
    const partes = window.location.pathname.split('/').filter(Boolean);
    const bruto = (partes[partes.length - 1] || '').toUpperCase();

    // =================================================================
    // 2) O CÓDIGO É VÁLIDO?
    //
    // O app sorteia códigos com este alfabeto exato (session_service.dart):
    //   ABCDEFGHJKLMNPQRSTUVWXYZ23456789
    // Sem 0/O e sem 1/I, que as pessoas confundem ao ler.
    //
    // Validar AQUI evita dois problemas: mostrar lixo em fonte 56px,
    // e mandar lixo para dentro do bilhete da Play Store. A faixa de
    // 4 a 8 caracteres é folgada de propósito — o formato de hoje é 6,
    // mas a página não deve quebrar se um dia mudar.
    // =================================================================
    const padraoCodigo = /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4,8}$/;
    const codigo = padraoCodigo.test(bruto) ? bruto : null;

    if (codigo) {
      // Mostra o código nos dois lugares (o grandão e o de digitar).
      document.getElementById('codigo').textContent = codigo;
      document.getElementById('codigoManual').textContent = codigo;

      // ===============================================================
      // 3) O BILHETE DA PLAY STORE — o coração desta mudança
      //
      // O PROBLEMA QUE ISTO RESOLVE:
      //   Clicar em "Instalar" e abrir o app são dois momentos
      //   separados, que podem ter dias de distância. Nada viaja
      //   sozinho de um para o outro. Sem o bilhete abaixo, quem
      //   instala por aqui chega no app sem o código e precisa
      //   digitá-lo à mão.
      //
      // COMO FUNCIONA:
      //   A Play Store guarda o que vier no parâmetro "referrer" e
      //   entrega ao app na PRIMEIRA execução. É a única ponte que
      //   atravessa a instalação.
      //
      // POR QUE utm_term E NÃO utm_content:
      //   utm_content é o espaço de nomes das ESTÓRIAS (as páginas /e/
      //   usam ele desde julho). Se o código de sessão viesse por ali,
      //   o app o trataria como id de estória e tentaria abrir uma
      //   estória que não existe.
      //   Usando utm_term, o app ATUAL simplesmente ignora o bilhete —
      //   ele procura utm_content, não acha, e sai quieto. Ou seja:
      //   esta página é segura de publicar ANTES de o app aprender a
      //   ler o novo formato.
      //
      // POR QUE encodeURIComponent:
      //   O bilhete é um endereço dentro de outro endereço. Sem
      //   codificar, os "&" do bilhete seriam lidos como separadores
      //   da URL da Play e o bilhete chegaria picado.
      // ===============================================================
      const bilhete = 'utm_source=samestoryapp'
                    + '&utm_medium=join'
                    + '&utm_term=' + codigo;

      document.getElementById('botaoInstalar').href =
        'https://play.google.com/store/apps/details'
        + '?id=com.samestoryapp.app'
        + '&referrer=' + encodeURIComponent(bilhete);

      // ===============================================================
      // 4) O BOTÃO "JÁ TENHO O APP"
      //
      // Aponta para a MESMA URL desta página, de propósito: é assim
      // que o Android intercepta um App Link e abre o app. Se o app
      // não estiver instalado (o caso normal aqui), o navegador só
      // recarrega esta página — por isso ele é secundário, e não o
      // botão principal como era antes.
      // ===============================================================
      document.getElementById('botaoAbrir').href =
        'https://samestoryapp.com/j/' + codigo;
    } else {
      // Sem código válido: esconde o bloco do código e o botão de
      // "já tenho o app" (que não teria para onde ir). O botão de
      // instalar continua, sem bilhete — ainda é uma página útil.
      document.getElementById('blocoCodigo').classList.add('oculto');
      document.getElementById('botaoAbrir').classList.add('oculto');
      document.getElementById('codigoManual').textContent = '—';
    }
  </script>
</body>
</html>
